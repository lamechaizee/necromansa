<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Necromansa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PIN Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1 class="logo">NECROMANSA</h1>
            <p class="subtitle">Link & Note Vault</p>
            <div id="setup-section" class="hidden">
                <p class="hint">Create a 4-6 digit PIN to secure your vault</p>
                <input type="password" id="new-pin" class="pin-input" maxlength="6" placeholder="Create PIN" inputmode="numeric" pattern="[0-9]*">
                <input type="password" id="confirm-pin" class="pin-input" maxlength="6" placeholder="Confirm PIN" inputmode="numeric" pattern="[0-9]*">
                <button id="btn-create-pin" class="btn-primary">Create Vault</button>
            </div>
            <div id="login-section" class="hidden">
                <input type="password" id="enter-pin" class="pin-input" maxlength="6" placeholder="Enter PIN" inputmode="numeric" pattern="[0-9]*">
                <button id="btn-unlock" class="btn-primary">Unlock</button>
            </div>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen">
        <header>
            <h1 class="logo-sm">NECROMANSA</h1>
            <div class="header-actions">
                <button id="btn-export" class="btn-icon" title="Export data">&#8681;</button>
                <button id="btn-import" class="btn-icon" title="Import data">&#8679;</button>
                <button id="btn-lock" class="btn-icon" title="Lock vault">&#9919;</button>
            </div>
            <input type="file" id="import-file" accept=".json" class="hidden">
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="links">Links</button>
            <button class="tab" data-tab="notes">Notes</button>
        </div>

        <!-- Links Tab -->
        <div id="tab-links" class="tab-content active">
            <div class="add-form">
                <input type="text" id="link-title" placeholder="Title" class="input-field">
                <input type="url" id="link-url" placeholder="https://..." class="input-field">
                <input type="text" id="link-tags" placeholder="Tags (comma separated)" class="input-field">
                <button id="btn-add-link" class="btn-primary">Add Link</button>
            </div>
            <input type="text" id="search-links" placeholder="Search links..." class="search-input">
            <div id="links-list" class="items-list"></div>
        </div>

        <!-- Notes Tab -->
        <div id="tab-notes" class="tab-content">
            <div class="add-form">
                <input type="text" id="note-title" placeholder="Title" class="input-field">
                <textarea id="note-content" placeholder="Write your note..." class="input-field textarea-field" rows="4"></textarea>
                <input type="text" id="note-tags" placeholder="Tags (comma separated)" class="input-field">
                <button id="btn-add-note" class="btn-primary">Add Note</button>
            </div>
            <input type="text" id="search-notes" placeholder="Search notes..." class="search-input">
            <div id="notes-list" class="items-list"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Edit</h2>
            <div id="modal-fields"></div>
            <div class="modal-actions">
                <button id="btn-modal-save" class="btn-primary">Save</button>
                <button id="btn-modal-cancel" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
